<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Varaha — CesiumJS 3D Viewer</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a0f;color:#e0e0e0;overflow:hidden}

  #cesiumContainer{position:absolute;top:0;left:0;right:320px;bottom:0}

  #sidebar{position:absolute;top:0;right:0;width:320px;bottom:0;background:#111118;
    border-left:1px solid #2a2a35;display:flex;flex-direction:column;z-index:10}
  #sidebar h2{padding:14px 16px 10px;font-size:15px;letter-spacing:.5px;color:#8af;
    border-bottom:1px solid #222}

  .section{padding:10px 16px;border-bottom:1px solid #1a1a25}
  .section label{font-size:12px;color:#888;display:block;margin-bottom:4px}
  .section select,.section button{width:100%;padding:8px 10px;border:1px solid #333;
    border-radius:6px;background:#1a1a25;color:#ccc;font-size:13px;cursor:pointer}
  .section select:focus,.section button:focus{outline:none;border-color:#5af}
  .section button{background:#1a3a5a;border-color:#2a5a8a;color:#8cf;margin-top:4px;
    transition:background .15s}
  .section button:hover{background:#254a6a}

  #controls{display:flex;gap:6px;padding:8px 16px;border-bottom:1px solid #1a1a25;align-items:center;flex-wrap:wrap}
  #controls button{flex:0 0 auto;padding:6px 12px;border:1px solid #333;border-radius:6px;
    background:#1a1a25;color:#ccc;font-size:13px;cursor:pointer}
  #controls button:hover{background:#252535}
  #controls button.active{background:#2a4a6a;border-color:#4a7aaa;color:#9cf}
  #speedLabel{font-size:11px;color:#777;white-space:nowrap}

  #camControls{display:flex;gap:4px;padding:4px 16px 8px;border-bottom:1px solid #1a1a25}
  #camControls button{padding:5px 10px;border:1px solid #333;border-radius:5px;
    background:#1a1a25;color:#aaa;font-size:11px;cursor:pointer;flex:1}
  #camControls button:hover{background:#252535}
  #camControls button.cam-active{background:#2a3a2a;border-color:#4a8a4a;color:#8e8}

  #eventLog{flex:1;overflow-y:auto;padding:8px 16px;font-size:12px;font-family:'Fira Mono',monospace}
  #eventLog .evt{padding:3px 0;border-bottom:1px solid #151520}
  #eventLog .evt-step{color:#666;min-width:40px;display:inline-block}
  #eventLog .evt-delivery{color:#f0c040}
  #eventLog .evt-hazard{color:#f06040}
  #eventLog .evt-collision{color:#ff3030}
  #eventLog .evt-success{color:#40e070}
  #eventLog .evt-battery{color:#ff6060}

  #summary{padding:10px 16px;border-top:1px solid #222;font-size:12px;line-height:1.7}
  #summary span{display:inline-block;padding:1px 6px;border-radius:3px;margin-right:4px}
  .tag-success{background:#1a3a1a;color:#5e5}
  .tag-fail{background:#3a1a1a;color:#f66}
  .tag-info{background:#1a2a3a;color:#8bf}

  .loading-overlay{position:absolute;top:0;left:0;right:320px;bottom:0;background:rgba(10,10,15,.85);
    display:flex;align-items:center;justify-content:center;z-index:20;font-size:16px;color:#8af}
</style>
</head>
<body>

<div id="cesiumContainer"></div>
<div id="loadingOverlay" class="loading-overlay">Select a trace to begin</div>

<div id="sidebar">
  <h2>VARAHA 3D VIEWER</h2>

  <div class="section">
    <label>Trace</label>
    <select id="traceSelect"><option value="">— loading traces —</option></select>
    <button id="loadBtn" disabled>Load Trace</button>
  </div>

  <div id="controls">
    <button id="playBtn" title="Play/Pause">&#9654;</button>
    <button id="resetBtn" title="Reset to start">&#8634;</button>
    <input id="speedSlider" type="range" min="1" max="200" value="20" style="flex:1">
    <span id="speedLabel">20x</span>
  </div>
  <div id="camControls">
    <button id="camOverview" class="cam-active" title="Birds-eye overview">Overview</button>
    <button id="camFollow" title="Follow drone from behind">Follow</button>
    <button id="camFPV" title="First-person drone view">FPV</button>
  </div>

  <div class="section" id="summary"></div>

  <h2 style="font-size:13px">EVENT LOG</h2>
  <div id="eventLog"></div>
</div>

<script>
(function(){
  /* ── CesiumJS setup ─────────────────────────────────────────────── */

  // Globe setup — use OSM imagery on a real 3D globe (no Ion token required)
  Cesium.Ion.defaultAccessToken = undefined;

  const viewer = new Cesium.Viewer('cesiumContainer', {
    imageryProvider: new Cesium.OpenStreetMapImageryProvider({
      url: 'https://tile.openstreetmap.org/'
    }),
    baseLayerPicker: false,
    geocoder: false,
    homeButton: false,
    sceneModePicker: true,
    navigationHelpButton: false,
    animation: false,
    timeline: true,
    fullscreenButton: false,
    vrButton: false,
    infoBox: true,
    selectionIndicator: true,
    shouldAnimate: false,
    skyBox: new Cesium.SkyBox({
      sources: {
        positiveX: 'https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Assets/Textures/SkyBox/tycho2t3_80_px.jpg',
        negativeX: 'https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Assets/Textures/SkyBox/tycho2t3_80_mx.jpg',
        positiveY: 'https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Assets/Textures/SkyBox/tycho2t3_80_py.jpg',
        negativeY: 'https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Assets/Textures/SkyBox/tycho2t3_80_my.jpg',
        positiveZ: 'https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Assets/Textures/SkyBox/tycho2t3_80_pz.jpg',
        negativeZ: 'https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Assets/Textures/SkyBox/tycho2t3_80_mz.jpg',
      }
    }),
  });

  viewer.scene.globe.enableLighting = true;
  viewer.scene.skyAtmosphere.show = true;
  viewer.scene.globe.depthTestAgainstTerrain = false;
  viewer.scene.backgroundColor = Cesium.Color.BLACK;


  /* ── DOM refs ────────────────────────────────────────────────────── */

  const traceSelect   = document.getElementById('traceSelect');
  const loadBtn       = document.getElementById('loadBtn');
  const playBtn       = document.getElementById('playBtn');
  const resetBtn      = document.getElementById('resetBtn');
  const speedSlider   = document.getElementById('speedSlider');
  const speedLabel    = document.getElementById('speedLabel');
  const eventLog      = document.getElementById('eventLog');
  const summaryEl     = document.getElementById('summary');
  const loadingOverlay= document.getElementById('loadingOverlay');
  const camOverview   = document.getElementById('camOverview');
  const camFollow     = document.getElementById('camFollow');
  const camFPV        = document.getElementById('camFPV');

  let isPlaying = false;
  let currentCzml = null;
  let camMode = 'overview'; // 'overview' | 'follow' | 'fpv'
  let tickHandler = null;

  /* ── Populate trace list ─────────────────────────────────────────── */

  fetch('/api/traces')
    .then(r => r.json())
    .then(names => {
      traceSelect.innerHTML = '<option value="">— select a trace —</option>';
      names.forEach(n => {
        const opt = document.createElement('option');
        opt.value = n; opt.textContent = n;
        traceSelect.appendChild(opt);
      });
      loadBtn.disabled = false;
    })
    .catch(()=>{
      traceSelect.innerHTML = '<option value="">Failed to load traces</option>';
    });

  /* ── Coordinate conversion (mirrors Python) ─────────────────────── */

  const ORIGIN_LAT = 38.55, ORIGIN_LON = -121.47;
  const M_PER_DEG_LAT = 111320.0;
  const M_PER_DEG_LON = 111320.0 * Math.cos(ORIGIN_LAT * Math.PI / 180);

  // Start camera looking at the California operations area
  viewer.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(ORIGIN_LON, ORIGIN_LAT, 50000),
    orientation: {
      heading: 0,
      pitch: Cesium.Math.toRadians(-70),
      roll: 0,
    }
  });

  function toLatLon(pos){
    return {
      lat: ORIGIN_LAT + pos.y / M_PER_DEG_LAT,
      lon: ORIGIN_LON + pos.x / M_PER_DEG_LON,
      alt: pos.z || 0,
    };
  }

  /* ── Client-side CZML builder ────────────────────────────────────── */

  function isoTime(step, dt){
    const t = step * dt;
    const h = String(Math.floor(t/3600)).padStart(2,'0');
    const m = String(Math.floor((t%3600)/60)).padStart(2,'0');
    const s = (t%60).toFixed(2).padStart(5,'0');
    return `2026-01-01T${h}:${m}:${s}Z`;
  }

  function traceToCZML(data){
    const world = data.world, trace = data.trace, summary = data.summary || {};
    const totalSteps = summary.total_steps || trace.length;
    const dt = 0.5;
    const start = isoTime(0, dt), end = isoTime(totalSteps, dt);

    const packets = [{
      id:'document', name:'Varaha Wildfire Logistics', version:'1.0',
      clock:{interval:`${start}/${end}`, currentTime:start, multiplier:20,
             range:'LOOP_STOP', step:'SYSTEM_CLOCK_MULTIPLIER'}
    }];

    // Drone path
    const cart = [];
    trace.forEach(pt=>{
      const s = pt.step * dt;
      const ll = toLatLon(pt.position);
      cart.push(s, ll.lon, ll.lat, ll.alt);
    });
    packets.push({
      id:'drone', name:'Delivery Drone',
      availability:`${start}/${end}`,
      position:{epoch:start, cartographicDegrees:cart,
                interpolationAlgorithm:'LAGRANGE', interpolationDegree:1},
      point:{color:{rgba:[0,200,255,255]}, pixelSize:14,
             outlineColor:{rgba:[255,255,255,255]}, outlineWidth:2,
             heightReference:'NONE'},
      path:{material:{solidColor:{color:{rgba:[0,180,255,140]}}},
            width:3, leadTime:0, trailTime:totalSteps*dt},
      label:{text:'Drone', font:'13pt sans-serif',
             fillColor:{rgba:[255,255,255,255]},
             outlineColor:{rgba:[0,0,0,220]}, outlineWidth:2,
             style:'FILL_AND_OUTLINE', verticalOrigin:'BOTTOM',
             pixelOffset:{cartesian2:[0,-18]},
             showBackground:true,
             backgroundColor:{rgba:[0,40,80,180]}},
    });

    // Base
    const bs = world.base_station;
    const bll = toLatLon(bs.position);
    packets.push({
      id:'base_station', name:'Base Station',
      position:{cartographicDegrees:[bll.lon, bll.lat, bll.alt]},
      point:{color:{rgba:[0,200,0,255]}, pixelSize:14,
             outlineColor:{rgba:[255,255,255,255]}, outlineWidth:2},
      ellipse:{semiMajorAxis:bs.recharge_radius||80, semiMinorAxis:bs.recharge_radius||80,
               height:0, material:{solidColor:{color:{rgba:[0,200,0,40]}}},
               outline:true, outlineColor:{rgba:[0,200,0,120]}},
      label:{text:'Base', font:'13pt sans-serif',
             fillColor:{rgba:[0,230,0,255]}, style:'FILL',
             verticalOrigin:'BOTTOM', pixelOffset:{cartesian2:[0,-16]}}
    });

    // Targets
    (world.targets||[]).forEach(t=>{
      const ll = toLatLon(t.position);
      const u = t.urgency || 0.5;
      const del = t.delivered;
      const r = Math.round(255*u), g = Math.round(100*(1-u));
      const c = del ? [80,200,80,200] : [r,g,40,255];
      const zc = del ? [80,200,80,25] : [r,g,40,30];
      const rad = t.delivery_radius || 80;
      packets.push({
        id:`target_${t.id}`, name:`Target ${t.id} (urg=${u.toFixed(1)})`,
        position:{cartographicDegrees:[ll.lon, ll.lat, ll.alt]},
        point:{color:{rgba:c}, pixelSize:12,
               outlineColor:{rgba:[255,255,255,200]}, outlineWidth:1},
        ellipse:{semiMajorAxis:rad, semiMinorAxis:rad, height:0,
                 extrudedHeight:ll.alt,
                 material:{solidColor:{color:{rgba:zc}}},
                 outline:true, outlineColor:{rgba:[...c.slice(0,3),100]}},
        label:{text:t.id, font:'12pt sans-serif', fillColor:{rgba:c},
               style:'FILL', verticalOrigin:'BOTTOM',
               pixelOffset:{cartesian2:[0,-14]}}
      });
    });

    // Hazards
    (world.hazards||[]).forEach(h=>{
      const ll = toLatLon(h.center);
      const ht = h.current_height || h.height || 80;
      const sev = h.severity || 0.5;
      const r2 = Math.round(200+55*sev), a = Math.round(30+40*sev);
      packets.push({
        id:`hazard_${h.id}`, name:`Hazard ${h.id} (sev=${sev.toFixed(1)})`,
        position:{cartographicDegrees:[ll.lon, ll.lat, 0]},
        cylinder:{length:ht, topRadius:h.radius*0.4, bottomRadius:h.radius,
                  material:{solidColor:{color:{rgba:[r2,60,0,a]}}},
                  outline:true, outlineColor:{rgba:[r2,60,0,100]},
                  numberOfVerticalLines:0},
        label:{text:h.id, font:'12pt sans-serif',
               fillColor:{rgba:[255,100,0,255]}, style:'FILL',
               verticalOrigin:'BOTTOM', pixelOffset:{cartesian2:[0,-14]}}
      });
    });

    // Obstacles
    (world.obstacles||[]).forEach(o=>{
      const mn = o.min_corner, mx = o.max_corner;
      const ht = (mx.z||0) - (mn.z||0);
      const corners = [
        {x:mn.x,y:mn.y,z:0},{x:mx.x,y:mn.y,z:0},
        {x:mx.x,y:mx.y,z:0},{x:mn.x,y:mx.y,z:0}
      ];
      const pos = [];
      corners.forEach(c=>{const ll=toLatLon(c); pos.push(ll.lon,ll.lat,0);});
      packets.push({
        id:`obstacle_${o.id}`, name:`Obstacle ${o.id}`,
        polygon:{positions:{cartographicDegrees:pos}, height:0, extrudedHeight:ht,
                 material:{solidColor:{color:{rgba:[120,120,120,60]}}},
                 outline:true, outlineColor:{rgba:[180,180,180,150]}}
      });
    });

    // Delivery events
    trace.forEach(pt=>{
      (pt.events||[]).forEach(evt=>{
        if(!evt.startsWith('delivered_')) return;
        const tid = evt.replace('delivered_','');
        const ll = toLatLon(pt.position);
        packets.push({
          id:`delivery_event_${tid}_s${pt.step}`,
          name:`Delivered ${tid}`,
          position:{cartographicDegrees:[ll.lon, ll.lat, ll.alt]},
          point:{color:{rgba:[255,220,0,255]}, pixelSize:16,
                 outlineColor:{rgba:[255,255,255,255]}, outlineWidth:2},
          label:{text:`Delivered ${tid}`, font:'13pt sans-serif',
                 fillColor:{rgba:[255,220,0,255]},
                 outlineColor:{rgba:[0,0,0,200]}, outlineWidth:2,
                 style:'FILL_AND_OUTLINE', verticalOrigin:'BOTTOM',
                 pixelOffset:{cartesian2:[0,-20]},
                 showBackground:true, backgroundColor:{rgba:[0,0,0,150]}}
        });
      });
    });

    return packets;
  }

  /* ── Load & display ──────────────────────────────────────────────── */

  function showSummary(data){
    const s = data.summary || {};
    const tags = [];
    tags.push(`<span class="tag-info">Steps: ${s.total_steps||'?'}</span>`);
    tags.push(`<span class="tag-info">Reward: ${(s.cumulative_reward||0).toFixed(1)}</span>`);
    tags.push(`<span class="tag-info">Battery: ${(s.final_battery||0).toFixed(1)}</span>`);
    const del = (s.delivered||[]).join(', ') || 'none';
    tags.push(`<span class="tag-info">Delivered: ${del}</span>`);
    tags.push(s.success
      ? '<span class="tag-success">SUCCESS</span>'
      : '<span class="tag-fail">INCOMPLETE</span>');
    summaryEl.innerHTML = tags.join(' ');
  }

  function showEventLog(trace){
    eventLog.innerHTML = '';
    trace.forEach(pt=>{
      (pt.events||[]).forEach(evt=>{
        if(!evt) return;
        let cls = 'evt-info';
        if(evt.startsWith('delivered_')) cls = 'evt-delivery';
        else if(evt.startsWith('hazard_')) cls = 'evt-hazard';
        else if(evt === 'collision') cls = 'evt-collision';
        else if(evt === 'success') cls = 'evt-success';
        else if(evt === 'battery_dead') cls = 'evt-battery';
        const div = document.createElement('div');
        div.className = 'evt';
        div.innerHTML = `<span class="evt-step">s${pt.step}</span> <span class="${cls}">${evt}</span>`;
        eventLog.appendChild(div);
      });
    });
  }

  async function loadTrace(){
    const name = traceSelect.value;
    if(!name) return;
    loadingOverlay.style.display = 'flex';
    loadingOverlay.textContent = 'Loading trace...';

    try{
      const resp = await fetch(`/${name}`);
      if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();

      loadingOverlay.textContent = 'Building 3D scene...';
      await new Promise(r=>setTimeout(r,50));

      const czml = traceToCZML(data);
      currentCzml = czml;

      viewer.dataSources.removeAll();
      const ds = await Cesium.CzmlDataSource.load(czml);
      viewer.dataSources.add(ds);

      // Camera: overview of the operational area from above
      const baseLl = toLatLon(data.world.base_station.position);
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(baseLl.lon, baseLl.lat, 12000),
        orientation: {
          heading: Cesium.Math.toRadians(0),
          pitch: Cesium.Math.toRadians(-60),
          roll: 0,
        },
        duration: 1.5,
      });

      showSummary(data);
      showEventLog(data.trace);

      isPlaying = false;
      viewer.clock.shouldAnimate = false;
      playBtn.textContent = '\u25B6';

      // Reset camera mode to overview
      camMode = 'overview';
      setActiveCamBtn(camOverview);
      stopCamTick();

      loadingOverlay.style.display = 'none';
    }catch(err){
      loadingOverlay.textContent = 'Error: ' + err.message;
      console.error(err);
    }
  }

  loadBtn.addEventListener('click', loadTrace);
  traceSelect.addEventListener('dblclick', loadTrace);

  /* ── Playback controls ───────────────────────────────────────────── */

  playBtn.addEventListener('click', ()=>{
    isPlaying = !isPlaying;
    viewer.clock.shouldAnimate = isPlaying;
    playBtn.textContent = isPlaying ? '\u23F8' : '\u25B6';
  });

  resetBtn.addEventListener('click', ()=>{
    if(viewer.dataSources.length > 0){
      const ds = viewer.dataSources.get(0);
      const clk = ds.clock;
      if(clk) viewer.clock.currentTime = clk.startTime.clone();
    }
  });

  speedSlider.addEventListener('input', ()=>{
    const v = parseInt(speedSlider.value);
    viewer.clock.multiplier = v;
    speedLabel.textContent = v + 'x';
  });

  /* ── Camera modes ────────────────────────────────────────────────── */

  function setActiveCamBtn(btn){
    [camOverview, camFollow, camFPV].forEach(b=>b.classList.remove('cam-active'));
    btn.classList.add('cam-active');
  }

  function getDroneEntity(){
    if(viewer.dataSources.length === 0) return null;
    return viewer.dataSources.get(0).entities.getById('drone');
  }

  function stopCamTick(){
    if(tickHandler){
      tickHandler();
      tickHandler = null;
    }
    viewer.trackedEntity = undefined;
  }

  camOverview.addEventListener('click', ()=>{
    camMode = 'overview';
    setActiveCamBtn(camOverview);
    stopCamTick();
    if(viewer.dataSources.length > 0) viewer.flyTo(viewer.dataSources.get(0), {duration:1});
  });

  camFollow.addEventListener('click', ()=>{
    camMode = 'follow';
    setActiveCamBtn(camFollow);
    stopCamTick();
    const drone = getDroneEntity();
    if(!drone) return;

    // Track the drone with a chase-cam offset (behind and above)
    viewer.trackedEntity = drone;
    const offset = new Cesium.HeadingPitchRange(
      Cesium.Math.toRadians(0),
      Cesium.Math.toRadians(-25),
      800
    );
    viewer.zoomTo(drone, offset);
  });

  camFPV.addEventListener('click', ()=>{
    camMode = 'fpv';
    setActiveCamBtn(camFPV);
    stopCamTick();
    const drone = getDroneEntity();
    if(!drone) return;

    // Tight first-person-ish view locked to drone
    viewer.trackedEntity = drone;
    const offset = new Cesium.HeadingPitchRange(
      Cesium.Math.toRadians(0),
      Cesium.Math.toRadians(-8),
      120
    );
    viewer.zoomTo(drone, offset);

    // Continuously update heading to face the direction of travel
    tickHandler = viewer.clock.onTick.addEventListener(()=>{
      if(!drone || !drone.position) return;
      const now = viewer.clock.currentTime;
      const pos = drone.position.getValue(now);
      if(!pos) return;
      const future = Cesium.JulianDate.addSeconds(now, 2, new Cesium.JulianDate());
      const futPos = drone.position.getValue(future);
      if(!futPos) return;
      const dir = Cesium.Cartesian3.subtract(futPos, pos, new Cesium.Cartesian3());
      if(Cesium.Cartesian3.magnitude(dir) < 0.01) return;
      const heading = Math.atan2(dir.x, dir.y);
      viewer.camera.setView({
        destination: viewer.camera.position,
        orientation:{
          heading: heading,
          pitch: Cesium.Math.toRadians(-12),
          roll: 0,
        }
      });
    });
  });

})();
</script>
</body>
</html>
